<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="C言語講義の参考資料の一覧です。">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>C言語 参考資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 左寄せの細い一覧。講義名の見出し、検索欄、資料を新しい順に並べる */
:root {
  --bg: #f7f8f6;
  --fg: #1b2420;
  --muted: #5d6a64;
  --line: #d9dfdb;
  --accent: #0b6b57;
  --accent-soft: #e1f0eb;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --fg: #e4ebe7; --muted: #93a39b; --line: #2a3430;
    --accent: #4cc9a7; --accent-soft: #1b2b26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --fg: #e4ebe7; --muted: #93a39b; --line: #2a3430;
  --accent: #4cc9a7; --accent-soft: #1b2b26; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.8; }
.wrap { max-width: 44rem; margin-inline: auto; padding-inline: 1rem; padding-block: 2.5rem 4rem; }
header h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.3; margin: 0; text-wrap: balance; }
header p { color: var(--muted); margin: .6rem 0 0; }
.prompt { font-family: var(--font-mono); font-size: .8rem; color: var(--accent); letter-spacing: .04em; margin: 0 0 .6rem; }
.tools { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; margin-block: 2rem 1rem; }
.tools input { flex: 1 1 14rem; min-width: 0; font: inherit; padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.tools input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
ul.list li { border-bottom: 1px solid var(--line); }
ul.list a { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; padding-block: 1rem; color: inherit; text-decoration: none; }
ul.list a:hover .title { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.title { font-weight: 700; font-size: 1.05rem; min-width: 0; }
.date { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; }
.summary { grid-column: 1 / -1; color: var(--muted); font-size: .92rem; margin: 0; }
.tag { display: inline-block; font-size: .72rem; padding: .05rem .5rem; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-right: .5rem; vertical-align: .1em; font-weight: 500; }
.empty { color: var(--muted); padding-block: 2rem; }
footer { margin-top: 3rem; font-size: .8rem; color: var(--muted); }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <p class="prompt">$ man c-lecture</p>
    <h1>C言語 講義の参考資料</h1>
    <p>講義の進み具合に合わせて、資料を1つずつ追加しています。</p>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="資料を検索(例: ポインタ)" aria-label="資料を検索">
    <span class="count" id="count"></span>
  </div>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>該当する資料はありません。</p>

  <footer>© 講義担当者 / 本資料は CC BY 4.0、サンプルコードは MIT License で利用できます。</footer>
</div>

<script>
(function () {
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  var q = document.getElementById('q');
  var items = [];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render() {
    var kw = q.value.trim().toLowerCase();
    var shown = items.filter(function (m) {
      return !kw || (m.title + m.summary + m.tag).toLowerCase().indexOf(kw) >= 0;
    });
    list.innerHTML = shown.map(function (m) {
      return '<li><a href="m/' + esc(m.slug) + '.html">' +
        '<span class="title"><span class="tag">' + esc(m.tag) + '</span>' + esc(m.title) + '</span>' +
        '<span class="date">' + esc(m.date) + '</span>' +
        '<p class="summary">' + esc(m.summary) + '</p></a></li>';
    }).join('');
    empty.hidden = shown.length > 0;
    count.textContent = shown.length + ' / ' + items.length + ' 件';
  }

  q.addEventListener('input', render);

  fetch('materials.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      items = data.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      render();
    })
    .catch(function () {
      empty.hidden = false;
      empty.textContent = '資料一覧を読み込めませんでした。ページを再読み込みしてください。';
    });
})();
</script>

</body>
</html>
